# =============================================================================
# nginx.conf — Reverse proxy for the LLM Serving Platform
#
# Sits in front of:
#   - vLLM engine      (http://vllm:8000)   — internal Docker network
#   - (optional) FastAPI gateway (http://gateway:8001) — if gateway profile active
#
# TLS certificates:
#   Mount your certs at /etc/nginx/certs/:
#     -v /host/path/to/certs:/etc/nginx/certs:ro
#   Or use Let's Encrypt / certbot — see Phase 1 docs.
#
# For development (no TLS), only the HTTP block is active and it proxies direct.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # ── Timeouts — must be long for LLM streaming responses ──────────────────
    # TTFT on large models can be 5–30s; full response can take minutes.
    proxy_connect_timeout   10s;
    proxy_send_timeout      600s;
    proxy_read_timeout      600s;
    send_timeout            600s;
    keepalive_timeout       75s;

    # ── Gzip — disable for streaming (breaks SSE) ────────────────────────────
    gzip off;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Adjust burst/rate to match your GPU capacity.
    # Rule of thumb: burst ≈ max_num_seqs in vllm.yaml
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/m;
    limit_req_zone $http_authorization  zone=api_per_key:10m rate=60r/m;

    # ── Upstream: vLLM engine ─────────────────────────────────────────────────
    # When running via docker-compose.yml, 'vllm' resolves via Docker's internal DNS.
    # For bare docker run, replace 'vllm' with 'host.docker.internal' or the host IP.
    upstream vllm_backend {
        server vllm-server:8000;
        keepalive 16;
    }

    # ── Upstream: FastAPI gateway (optional) ──────────────────────────────────
    # Uncomment and use 'gateway_backend' instead of 'vllm_backend' if you deploy
    # the FastAPI gateway container (adds auth, pricing headers, request logging).
    # upstream gateway_backend {
    #     server gateway:8001;
    #     keepalive 16;
    # }

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";     # for keepalive to upstream

    # ── HTTP server (dev / plain HTTP) ───────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check — unauthenticated, no rate-limit (for load balancers / monitoring)
        location = /health {
            proxy_pass         http://vllm_backend/health;
            proxy_read_timeout 10s;
            access_log         off;
        }

        # OpenAI-compatible API
        location /v1/ {
            limit_req zone=api_per_ip burst=10 nodelay;

            proxy_pass             http://vllm_backend;
            proxy_buffering        off;    # REQUIRED for SSE/streaming responses
            proxy_cache            off;
            proxy_request_buffering off;
        }

        # Prometheus metrics — restrict to localhost / monitoring network
        location = /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker internal network range
            allow 10.0.0.0/8;      # Private network
            deny  all;
            proxy_pass http://vllm_backend/metrics;
        }

        # Catch-all: forward everything else to vLLM
        location / {
            proxy_pass             http://vllm_backend;
            proxy_buffering        off;
            proxy_cache            off;
        }
    }

    # ── HTTPS server (production) ─────────────────────────────────────────────
    # Uncomment when TLS certificates are available at /etc/nginx/certs/
    #
    # server {
    #     listen 443 ssl;
    #     http2  on;
    #     server_name YOUR_DOMAIN_HERE;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # Modern TLS config (Mozilla Intermediate)
    #     ssl_protocols             TLSv1.2 TLSv1.3;
    #     ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache         shared:SSL:10m;
    #     ssl_session_timeout       1d;
    #
    #     # HSTS (enable after confirming HTTPS works)
    #     # add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Health check
    #     location = /health {
    #         proxy_pass         http://vllm_backend/health;
    #         proxy_read_timeout 10s;
    #         access_log         off;
    #     }
    #
    #     # OpenAI-compatible API
    #     location /v1/ {
    #         limit_req zone=api_per_ip burst=10 nodelay;
    #         proxy_pass             http://vllm_backend;
    #         proxy_buffering        off;
    #         proxy_cache            off;
    #         proxy_request_buffering off;
    #     }
    #
    #     # Metrics — internal only
    #     location = /metrics {
    #         allow 127.0.0.1;
    #         allow 172.16.0.0/12;
    #         allow 10.0.0.0/8;
    #         deny  all;
    #         proxy_pass http://vllm_backend/metrics;
    #     }
    #
    #     location / {
    #         proxy_pass             http://vllm_backend;
    #         proxy_buffering        off;
    #         proxy_cache            off;
    #     }
    # }
    #
    # # Redirect HTTP → HTTPS
    # server {
    #     listen 80;
    #     server_name YOUR_DOMAIN_HERE;
    #     return 301 https://$host$request_uri;
    # }
}
