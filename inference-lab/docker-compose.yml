# Single vLLM server (manual mode). Override with env: MODEL=... docker compose up
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ports: ["8000:8000"]
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${MODEL:-Qwen/Qwen3-8B}
      --max-model-len ${MAX_LEN:-8192}
      --gpu-memory-utilization ${GPU_UTIL:-0.90}
      --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
