model: Qwen/Qwen3-8B
image: vllm/vllm-openai:latest
out: results/week6
port: 8000
startup_timeout: 1200
server_args:
- --dtype
- bfloat16
- --max-model-len
- '8192'
- --gpu-memory-utilization
- '0.90'
- --enable-prefix-caching
requests: 128
concurrency:
- 1
- 4
- 16
- 32
request_rates:
- 1
max_inflight: 128
seed: 17
workloads:
- name: uniform
  shapes:
  - input_tokens: 1024
    output_tokens: 256
    weight: 1
experiments:
- tag: tp1
  replicas:
  - replica-a
  policy: round-robin
  servers:
  - name: replica-a
    gpus:
    - 0
    tensor_parallel_size: 1
- tag: tp2
  replicas:
  - replica-a
  policy: round-robin
  servers:
  - name: replica-a
    gpus:
    - 0
    - 1
    tensor_parallel_size: 2
- tag: two-rr
  replicas:
  - replica-a
  - replica-b
  policy: round-robin
  servers:
  - name: replica-a
    gpus:
    - 0
    tensor_parallel_size: 1
  - name: replica-b
    gpus:
    - 1
    tensor_parallel_size: 1
